    // ==========================================
    // 2. VOICE INPUT COMPONENT
    // ==========================================
    function VoiceInput({ onTranscript, lang = 'en' }) {
      const [isListening, setIsListening] = useState(false);

      const toggleListening = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
          // Graceful fallback for mock or unsupported speech
          const sample = lang === 'hi' 
            ? ["सोजत सिटी, राजस्थान", "किराना दुकान", "रमेश शर्मा"][Math.floor(Math.random() * 3)]
            : ["Sojat City, Rajasthan", "Grocery & provisions store", "Ramesh Sharma"][Math.floor(Math.random() * 3)];
          onTranscript(sample);
          return;
        }

        if (isListening) {
          setIsListening(false);
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';

          recognition.onstart = () => setIsListening(true);
          recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            if (text) onTranscript(text);
            setIsListening(false);
          };
          recognition.onerror = () => setIsListening(false);
          recognition.onend = () => setIsListening(false);
          recognition.start();
        } catch (err) {
          setIsListening(false);
        }
      };

      return (
        <button
          type="button"
          className={`voice-btn-inline ${isListening ? 'listening' : ''}`}
          onClick={toggleListening}
          title={isListening ? 'Listening...' : (lang === 'hi' ? 'बोलकर दर्ज करें (Voice)' : 'Click to Speak (Voice-to-text)')}
          aria-label="Voice to text"
        >

            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="22" />
          </svg>
        </button>
      );
    }

    // ==========================================
    // 3. LOCATION PICKER (AUTO GPS + MANUAL)
    // ==========================================
    function LocationPicker({ location, onChange, onMetricsChange, lang = 'en' }) {
      const [isLocating, setIsLocating] = useState(false);
      const [mode, setMode] = useState('manual');

      const handleDetectGPS = () => {
        setIsLocating(true);
        if (!navigator.geolocation) {
          const detected = "Sojat City, Rajasthan (Auto GPS)";
          onChange(detected);
          setMode('gps');
          setIsLocating(false);
          if (onMetricsChange) {
            onMetricsChange({ households: "~1,400", distance: "600m", competition: 2, tier: "Semi-Urban" });
          }
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const detected = "Sojat City, Rajasthan (GPS Verified)";
            onChange(detected);
            setMode('gps');
            setIsLocating(false);
            if (onMetricsChange) {
              onMetricsChange({ households: "~1,400", distance: "600m", competition: 2, tier: "Semi-Urban" });
            }
          },
          (err) => {
            const detected = "Sojat City, Rajasthan (Auto-located)";
            onChange(detected);
            setMode('gps');
            setIsLocating(false);
            if (onMetricsChange) {
              onMetricsChange({ households: "~1,400", distance: "600m", competition: 2, tier: "Semi-Urban" });
            }
          },
          { timeout: 5000 }
        );
      };

      const handleSelectLocation = (loc) => {
        onChange(loc.name);
        setMode('manual');
        if (onMetricsChange) {
          onMetricsChange({ households: loc.households, distance: loc.distance, competition: loc.competition, tier: loc.tier });
        }
      };

      return (

            <button

              className="btn-detect-gps"
              onClick={handleDetectGPS}
              disabled={isLocating}

              {mode === 'gps' 
                ? (lang === 'hi' ? '✓ जीपीएस सत्यापित' : '✓ GPS Verified')
                : (lang === 'hi' ? '✍️ मैनुअल चयन' : '✍️ Manual Entry')}
            </span>

            <input

              onChange={(e) => { onChange(e.target.value); setMode('manual'); }}
              placeholder={lang === 'hi' ? 'गाँव या कस्बा, ज़िला' : 'Village or town, district'}

            <VoiceInput

    // ==========================================
    // 5. LOAN CALCULATOR
    // ==========================================
    function LoanCalculator({ capital, scheme, cibilScore = 720, lang = 'en' }) {
      let marginPct = 0.10;
      if (scheme.id === 'pmegp') marginPct = 0.05;
      else if (scheme.id === 'mudra') marginPct = 0.15;
      else if (scheme.id === 'standup') marginPct = 0.15;
      else if (scheme.id === 'svanidhi') marginPct = 0.00;

      if (cibilScore >= 750 && marginPct > 0.05) {
        marginPct -= 0.02;
      }

      const totalProjectCost = Math.round(capital * 1.35);
      const promoterMargin = Math.round(totalProjectCost * marginPct);

      let subsidyAmount = 0;
      if (scheme.id === 'pmegp') {
        subsidyAmount = Math.round(totalProjectCost * 0.25);
      } else if (scheme.id === 'svanidhi') {
        subsidyAmount = 2500;
      }

      const termLoanAmount = Math.max(0, totalProjectCost - promoterMargin - subsidyAmount);
      const workingCapitalAllocation = Math.round(termLoanAmount * 0.40);
      const fixedAssetAllocation = termLoanAmount - workingCapitalAllocation;

      return (
        <div className="loan-calculator-module">
          <div style={{ marginBottom: '24px' }}>
            <h3>{lang === 'hi' ? 'परियोजना ऋण व पूंजी गणना' : 'Project Cost & Term Loan Calculation'}</h3>
            <p style={{ color: 'var(--ink-soft)', fontSize: '0.94rem', marginTop: '4px' }}>
              {lang === 'hi'
                ? 'आपकी शुरुआती पूंजी और चयनित योजना के आधार पर परियोजना लागत, मार्जिन और स्वीकृत ऋण का स्पष्ट विवरण'
                : 'Clear breakdown of total project cost, promoter margin equity, subsidy grant, and net term loan'}
            </p>
          </div>

          <div className="fin-summary">
            <div className="fin-card">
              <div className="lbl">{lang === 'hi' ? 'कुल अनुमानित परियोजना लागत' : 'Total Project Outlay'}</div>
              <div className="val">₹{totalProjectCost.toLocaleString('en-IN')}</div>
              <div style={{ fontSize: '0.75rem', color: 'var(--ink-soft)', marginTop: '4px' }}>
                {lang === 'hi' ? 'स्टॉक + दुकान सज्जा + कार्यशील पूंजी' : 'Stock + Fixtures + Working Capital'}
              </div>
            </div>

            <div className="fin-card paddy-accent">
              <div className="lbl">{lang === 'hi' ? 'आपका मार्जिन-मनी योगदान' : 'Your Margin Contribution'}</div>
              <div className="val">₹{promoterMargin.toLocaleString('en-IN')}</div>
              <div style={{ fontSize: '0.75rem', color: 'var(--paddy-deep)', marginTop: '4px', fontWeight: '700' }}>
                {Math.round(marginPct * 100)}% {lang === 'hi' ? 'खुद की पूंजी' : 'Promoter Equity'}
              </div>
            </div>

            <div className="fin-card accent">
              <div className="lbl">{lang === 'hi' ? 'बैंक टर्म लोन स्वीकृति' : 'Bank Term Loan Sanction'}</div>
              <div className="val">₹{termLoanAmount.toLocaleString('en-IN')}</div>
              <div style={{ fontSize: '0.75rem', color: 'var(--ink)', marginTop: '4px', fontWeight: '700' }}>
                @ {scheme.interestRate} {lang === 'hi' ? 'वार्षिक ब्याज' : 'p.a. Interest'}
              </div>
            </div>
          </div>

          {subsidyAmount > 0 && (
            <div style={{ 
              background: 'var(--paddy-light)', 
              border: '2px solid var(--paddy)', 
              borderRadius: 'var(--radius)', 
              padding: '14px 20px', 
              marginBottom: '24px',

            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    function RepaymentPlanner({ loanAmount = 144000, annualInterestRate = 6.0, initialMoratoriumQuarters = 2, lang = 'en' }) {
      const [tenureYears, setTenureYears] = useState(3);
      const [frequency, setFrequency] = useState('quarterly');
      const [moratoriumQuarters, setMoratoriumQuarters] = useState(initialMoratoriumQuarters);

      const totalQuarters = tenureYears * 4;
      const payingQuarters = Math.max(1, totalQuarters - moratoriumQuarters);
      const quarterlyRate = (annualInterestRate / 100) / 4;
      const principalPerQuarter = Math.round(loanAmount / payingQuarters);

      const schedule = [];
      let remainingPrincipal = loanAmount;
      let totalInterest = 0;

      for (let q = 1; q <= totalQuarters; q++) {
        if (q <= moratoriumQuarters) {
          schedule.push({ label: `Q${q}`, type: 'moratorium', amount: 0 });
        } else {
          const interestForQ = Math.round(remainingPrincipal * quarterlyRate);
          totalInterest += interestForQ;
          const instalment = principalPerQuarter + interestForQ;
          remainingPrincipal = Math.max(0, remainingPrincipal - principalPerQuarter);
          schedule.push({ label: `Q${q}`, type: 'pay', amount: instalment });
        }
      }

      const maxInstalment = Math.max(...schedule.map(d => d.amount), 1);
      const totalRepayment = loanAmount + totalInterest;
      const avgMonthlyEq = Math.round(totalRepayment / (totalQuarters * 3));

      return (
        <div className="repayment-planner-module">
          <div style={{ marginBottom: '24px' }}>
            <h3>{lang === 'hi' ? 'ईएमआई व चुकौती योजना (Repayment Planning)' : 'EMI & Cashflow Repayment Planning'}</h3>
            <p style={{ color: 'var(--ink-soft)', fontSize: '0.94rem', marginTop: '4px' }}>
              {lang === 'hi'
                ? 'अपनी दुकान की वास्तविक आमदनी के अनुसार किश्त का समय और मोहलत अवधि तय करें'
                : 'Configure your repayment schedule with grace moratorium so instalments begin only after business income stabilises'}
            </p>
          </div>

          <div className="panel" style={{ padding: '22px 24px', marginBottom: '26px' }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '20px' }}>
              <div>
                <label style={{ display: 'block', fontWeight: '700', fontSize: '0.88rem', marginBottom: '8px' }}>
                  {lang === 'hi' ? 'किश्त का प्रकार (Frequency):' : 'Repayment Frequency:'}
                </label>
                <div style={{ display: 'flex', gap: '8px' }}>
                  <button
                    type="button"
                    className={`btn sm ${frequency === 'quarterly' ? 'primary-dark' : 'secondary'}`}
                    onClick={() => setFrequency('quarterly')}
                  >
                    {lang === 'hi' ? 'तिमाही (Quarterly)' : 'Quarterly'}
                  </button>
                  <button
                    type="button"
                    className={`btn sm ${frequency === 'monthly' ? 'primary-dark' : 'secondary'}`}
                    onClick={() => setFrequency('monthly')}
                  >
                    {lang === 'hi' ? 'मासिक (Monthly)' : 'Monthly'}
                  </button>
                </div>
              </div>

              <div>
                <label style={{ display: 'block', fontWeight: '700', fontSize: '0.88rem', marginBottom: '8px' }}>
                  {lang === 'hi' ? `ऋण अवधि: ${tenureYears} वर्ष (${totalQuarters} तिमाही)` : `Loan Tenure: ${tenureYears} Years (${totalQuarters} Quarters)`}
                </label>
                <input
                  type="range"
                  min="1"
                  max="5"
                  step="1"
                  value={tenureYears}
                  onChange={(e) => setTenureYears(Number(e.target.value))}
                />
                <div className="range-labels">
                  <span>1 {lang === 'hi' ? 'वर्ष' : 'Yr'}</span>
                  <span>3 {lang === 'hi' ? 'वर्ष' : 'Yrs'}</span>
                  <span>5 {lang === 'hi' ? 'वर्ष' : 'Yrs'}</span>
                </div>
              </div>

              <div>
                <label style={{ display: 'block', fontWeight: '700', fontSize: '0.88rem', marginBottom: '8px' }}>
                  {lang === 'hi' ? `मोहलत अवधि: ${moratoriumQuarters} तिमाही (${moratoriumQuarters * 3} माह)` : `Moratorium Grace: ${moratoriumQuarters} Quarters (${moratoriumQuarters * 3} Months)`}
                </label>
                <input
                  type="range"
                  min="0"
                  max="4"
                  step="1"
                  value={moratoriumQuarters}
                  onChange={(e) => setMoratoriumQuarters(Number(e.target.value))}
                />
                <div className="range-labels">
                  <span>0 ({lang === 'hi' ? 'शून्य' : 'None'})</span>
                  <span>2 ({lang === 'hi' ? '6 माह' : '6 Mo'})</span>
                  <span>4 ({lang === 'hi' ? '1 वर्ष' : '1 Yr'})</span>
                </div>
              </div>
            </div>
          </div>

          <div className="fin-summary" style={{ marginBottom: '28px' }}>
            <div className="fin-card">
              <div className="lbl">{lang === 'hi' ? 'औसत मासिक बराबर किश्त' : 'Monthly Equivalent EMI'}</div>
              <div className="val">₹{avgMonthlyEq.toLocaleString('en-IN')}</div>
              <div style={{ fontSize: '0.74rem', color: 'var(--ink-soft)', marginTop: '4px' }}>
                {lang === 'hi' ? 'दुकानदार की सुविधा अनुसार' : 'Calculated on net repayment tenure'}
              </div>
            </div>

            <div className="fin-card">
              <div className="lbl">{lang === 'hi' ? 'कुल देय ब्याज (Total Interest)' : 'Total Interest Payable'}</div>
              <div className="val" style={{ color: 'var(--brick-deep)' }}>₹{totalInterest.toLocaleString('en-IN')}</div>
              <div style={{ fontSize: '0.74rem', color: 'var(--ink-soft)', marginTop: '4px' }}>
                @ {annualInterestRate}% {lang === 'hi' ? 'वार्षिक योजना दर' : 'Scheme Annual Rate'}
              </div>
            </div>

            <div className="fin-card accent">
              <div className="lbl">{lang === 'hi' ? 'कुल चुकौती राशि (मूल + ब्याज)' : 'Total Payable (Principal + Int)'}</div>
              <div className="val">₹{totalRepayment.toLocaleString('en-IN')}</div>
              <div style={{ fontSize: '0.74rem', color: 'var(--ink)', marginTop: '4px', fontWeight: '700' }}>
                {payingQuarters} {lang === 'hi' ? 'किश्तों में विभाजित' : 'Paying instalments'}
              </div>
            </div>
          </div>

          <div className="timeline-head">
            <h4>{lang === 'hi' ? 'तिमाही-दर-तिमाही चुकौती अनुसूची (Quarterly Visual Graph)' : 'Quarterly Repayment Schedule Visualizer'}</h4>
            <div className="legend">
              <span>
                <span className="sw" style={{ background: 'var(--paper-alt)', border: '1px solid var(--ink-faint)' }}></span>
                {lang === 'hi' ? 'मोहलत (0 किश्त)' : 'Moratorium (Grace Period)'}
              </span>
              <span>
                <span className="sw" style={{ background: 'var(--indigo)' }}></span>
                {lang === 'hi' ? 'नियमित किश्त' : 'Repayment Instalment'}
              </span>
            </div>
          </div>

          <div className="timeline">
            {schedule.map((d, index) => {
              const heightPct = d.type === 'moratorium' ? 15 : Math.max(22, (d.amount / maxInstalment) * 100);
              return (
                <div key={index} className="tl-bar-wrap">
                  <div
                    className={`tl-bar ${d.type}`}
                    style={{ height: `${heightPct}%` }}
                    title={`${d.label}: ${d.type === 'moratorium' ? (lang === 'hi' ? 'मोहलत (₹0)' : 'Moratorium Grace') : '₹' + d.amount.toLocaleString('en-IN')}`}
                  ></div>
                  <div className="tl-label">{d.label}</div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function CibilScore({ score, onScoreChange, lang = 'en' }) {
      let category = 'Fair';
      let categoryHi = 'औसत (Fair)';
      let color = 'var(--marigold-deep)';
      let badgeClass = 'fair';
      let approvalOdds = '65%';
      let interestImpact = 'Standard rack rate';
      let interestImpactHi = 'मानक ब्याज दर लागू';
      let marginReq = '15%';

      if (score >= 750) {
        category = 'Excellent';
        categoryHi = 'उत्कृष्ट (Excellent)';
        color = 'var(--paddy)';
        badgeClass = 'excellent';
        approvalOdds = '94%';
        interestImpact = '-0.50% concessional rebate';
        interestImpactHi = '0.50% ब्याज में विशेष छूट';
        marginReq = '10% (Lowest)';
      } else if (score >= 700) {
        category = 'Good';
        categoryHi = 'अच्छा (Good)';
        color = 'var(--indigo)';
        badgeClass = 'good';
        approvalOdds = '85%';
        interestImpact = 'Priority sanction';
        interestImpactHi = 'त्वरित ऋण स्वीकृति';
        marginReq = '10% - 15%';
      } else if (score >= 600) {
        category = 'Fair';
        categoryHi = 'औसत (Fair)';
        color = 'var(--marigold-deep)';
        badgeClass = 'fair';
        approvalOdds = '65%';
        interestImpact = 'Standard scheme rate';
        interestImpactHi = 'मानक ब्याज दर लागू';
        marginReq = '15% - 20%';
      } else {
        category = 'Needs Attention';
        categoryHi = 'सुधार आवश्यक (Poor)';
        color = 'var(--brick)';
        badgeClass = 'poor';
        approvalOdds = '40% (Guarantor needed)';
        interestImpact = '+1.00% risk premium';
        interestImpactHi = '+1.00% अतिरिक्त जोखिम प्रीमियम';
        marginReq = '25% margin required';
      }

      const percentage = (score - 300) / 600;
      const rotationDeg = -90 + percentage * 180;

      return (
        <div className="cibil-card">
          <div className="cibil-layout">
            <div className="cibil-gauge-wrap">
              <svg className="cibil-dial-svg" viewBox="0 0 200 120">
                <path d="M 20 110 A 80 80 0 0 1 180 110" fill="none" stroke="var(--paper-alt)" strokeWidth="18" strokeLinecap="round" />
                <path d="M 20 110 A 80 80 0 0 1 65 37" fill="none" stroke="var(--brick)" strokeWidth="18" />
                <path d="M 65 37 A 80 80 0 0 1 100 30" fill="none" stroke="var(--marigold)" strokeWidth="18" />
                <path d="M 100 30 A 80 80 0 0 1 135 37" fill="none" stroke="var(--indigo)" strokeWidth="18" />
                <path d="M 135 37 A 80 80 0 0 1 180 110" fill="none" stroke="var(--paddy)" strokeWidth="18" strokeLinecap="round" />
                <circle cx="100" cy="110" r="10" fill="var(--ink)" />
                <line
                  x1="100"
                  y1="110"
                  x2="100"
                  y2="42"
                  stroke="var(--ink)"
                  strokeWidth="4"
                  strokeLinecap="round"
                  transform={`rotate(${rotationDeg} 100 110)`}
                  style={{ transition: 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1.2)' }}
                />
              </svg>

              <div className="cibil-score-number">{score}</div>
              <span className={`cibil-badge ${badgeClass}`}>
                {lang === 'hi' ? categoryHi : category}
              </span>

              <div className="cibil-slider-wrap">
                <input
                  type="range"
                  min="300"
                  max="900"
                  step="5"
                  value={score}
                  onChange={(e) => onScoreChange(Number(e.target.value))}
                  aria-label="CIBIL Score Slider"
                />
                <div className="range-labels">
                  <span>300 (Poor)</span>
                  <span>750+ (Ideal)</span>
                  <span>900 (Max)</span>
                </div>
              </div>
            </div>

            <div className="cibil-details">
              <h3>{lang === 'hi' ? 'सिबिल / क्रेडिट स्कोर प्रभाव' : 'CIBIL & Credit Assessment'}</h3>
              <p style={{ color: 'var(--ink-soft)', fontSize: '0.94rem', marginTop: '6px', lineHeight: '1.55' }}>
                {lang === 'hi'
                  ? 'आपका क्रेडिट स्कोर बैंक लोन स्वीकृति, ब्याज दर और आवश्यक मार्जिन-मनी राशि को सीधे प्रभावित करता है।'
                  : 'Your credit score directly dictates bank appraisal velocity, concession on interest rates, and promoter margin requirement.'}
              </p>

              <div className="cibil-impact-list">
                <div className="cibil-impact-item">
                  <span>{lang === 'hi' ? 'ऋण स्वीकृति संभावना (Sanction Probability):' : 'Bank Approval Odds:'}</span>
                  <strong style={{ color: color, fontSize: '1.05rem' }}>{approvalOdds}</strong>
                </div>
                <div className="cibil-impact-item">
                  <span>{lang === 'hi' ? 'ब्याज दर प्रभाव (Rate Impact):' : 'Interest Rate Concession:'}</span>
                  <strong>{lang === 'hi' ? interestImpactHi : interestImpact}</strong>
                </div>
                <div className="cibil-impact-item">
                  <span>{lang === 'hi' ? 'प्रवर्तक मार्जिन आवश्यकता:' : 'Required Margin Money:'}</span>
                  <strong>{marginReq}</strong>
                </div>
              </div>

              <div style={{ marginTop: '18px', padding: '12px 16px', background: 'var(--paper-alt)', borderRadius: '6px', fontSize: '0.86rem' }}>
                <strong>💡 {lang === 'hi' ? 'छोटे व्यापारियों के लिए सिबिल सुधार सुझाव:' : 'Hyperlocal Merchant Credit Tip:'}</strong>
                <p style={{ marginTop: '4px', color: 'var(--ink-soft)' }}>
                  {score < 700 
                    ? (lang === 'hi' 
                        ? 'दुकान का बैंक खाता नियमित रखें, UPI क्यूआर से पेमेंट स्वीकारें, और स्वयं सहायता समूह (SHG) या मुद्रा कार्ड का समय पर भुगतान कर स्कोर 750+ पहुंचाएं।' 
                        : 'Maintain daily UPI QR transactions into your business current account and clear micro-overdrafts on time to reach 750+ score.')
                    : (lang === 'hi'
                        ? 'उत्कृष्ट स्कोर! आप बिना किसी बंधक (Collateral-Free) के NSFDC, PMEGP या मुद्रा के तहत न्यूनतम ब्याज पर ऋण पाने के पात्र हैं।'
                        : 'Excellent standing! You qualify for collateral-free sanction under NSFDC & PMEGP with top-bracket interest concessions.')}
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function Chatbot({ isOpen, onClose, lang = 'en', entrepreneurName = '' }) {
      const [messages, setMessages] = useState([
        {
          sender: 'bot',
          text: lang === 'hi' 
            ? "नमस्ते! मैं खाता साथी हूँ, आपका व्यापार सलाहकार। मुझसे दुकान की व्यवहार्यता, NSFDC मार्जिन-मनी, PMEGP सब्सिडी, या सिबिल स्कोर के बारे में कोई भी सवाल पूछें।" 
            : "Namaste! I am Khata Saathi, your AI Business Advisor. Ask me about shop feasibility, NSFDC margin-money loans, PMEGP subsidies, or CIBIL score requirements."

      ]);
      const [inputVal, setInputVal] = useState('');
      const messagesEndRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const handleSend = (textToSend) => {
        const text = textToSend || inputVal;
        if (!text.trim()) return;

        setMessages(prev => [...prev, { sender: 'user', text: text.trim() }]);
        setInputVal('');

        setTimeout(() => {
          const lower = text.toLowerCase();
          let botReply = "";

          if (lower.includes('cibil') || lower.includes('सिबिल') || lower.includes('score')) {
            botReply = lang === 'hi'
              ? "एनएसएफडीसी और मुद्रा लोन के लिए 680-720 का सिबिल स्कोर स्वीकार्य है। 750+ स्कोर होने पर तुरंत ऋण और 0.5% ब्याज छूट मिलती है। बिना सिबिल इतिहास वाले व्यापारी यूपीआई या स्वयं सहायता समूह (SHG) रिकॉर्ड दिखा सकते हैं।"
              : "For NSFDC and Mudra loans, a CIBIL score of 680–720 is workable. A score above 750 unlocks priority processing and a 0.5% interest rate rebate. If you lack credit history, banks accept UPI transactions or SHG linkage.";
          } else if (lower.includes('pmegp') || lower.includes('subsidy') || lower.includes('सब्सिडी')) {
            botReply = lang === 'hi'
              ? "पीएमईजीपी (PMEGP) योजना में ग्रामीण व विशेष वर्ग (महिला, एससी/एसटी) को 35% तक प्रत्यक्ष सरकारी पूंजीगत सब्सिडी मिलती है। खुद की पूंजी मात्र 5% से 10% लगानी होती है!"
              : "Under PMEGP, you can get a capital subsidy of 25% (for general) or up to 35% (for special categories like SC/ST, Women, and Rural units) with only 5%-10% own promoter margin.";
          } else if (lower.includes('grocery') || lower.includes('किराना') || lower.includes('shop')) {
            botReply = lang === 'hi'
              ? "किराना दुकान शुरू करने के लिए कम से कम 3 महीने का नकद माल भंडार रखें। साथ ही 100 रुपये वाला बुनियादी FSSAI खाद्य पंजीकरण और निःशुल्क उद्यम आधार प्रमाणपत्र अवश्य बनवाएं।"
              : "For a grocery store, maintain at least a 3-month working capital cushion for inventory turnover. Also obtain an FSSAI Basic Registration (₹100/yr) and free Udyam Aadhaar certificate.";
          } else if (lower.includes('moratorium') || lower.includes('मोहलत') || lower.includes('emi') || lower.includes('किश्त')) {
            botReply = lang === 'hi'
              ? "खाता सूक्ष्म व्यापारियों को कम से कम 2 तिमाही (6 माह) की मोहलत अवधि की सलाह देता है, ताकि जब तक दुकान से नियमित ग्राहक और कमाई न बंधे, बैंक किश्त का बोझ न पड़े।"
              : "Khata recommends a 2-quarter (6 month) moratorium for micro-enterprises. During this period, you pay zero principal so your inventory turns profitable before repayments begin.";
          } else {
            botReply = lang === 'hi'
              ? `धन्यवाद ${entrepreneurName ? entrepreneurName + ' जी' : ''}। आपका सवाल दर्ज कर लिया गया है। खाता सलाहकार स्थानीय बैंक व सरकारी योजनाओं के नियम अनुसार हर संभव मदद करेगा।`
              : `Thank you ${entrepreneurName ? entrepreneurName : ''}. Khata Saathi has noted your query. We cross-verify all guidelines with official MSME and NSFDC lending directives.`;
          }

          setMessages(prev => [...prev, { sender: 'bot', text: botReply }]);
        }, 400);
      };

      const chips = lang === 'hi' 
        ? ["क्या 650 सिबिल पर लोन मिलेगा?", "PMEGP सब्सिडी के नियम क्या हैं?", "किराना दुकान के लिए जरूरी कागजात", "मोहलत अवधि का क्या फायदा है?"]
        : ["Can I get loan with 680 CIBIL?", "How to get 35% PMEGP subsidy?", "Licenses needed for grocery shop?", "Why is 2-quarter moratorium needed?"];

      return (
        <div className="chatbot-drawer-overlay" onClick={onClose}>
          <div className="chatbot-drawer" onClick={(e) => e.stopPropagation()}>
            <div className="chatbot-header">
              <div className="chatbot-title-box">
                <div className="chatbot-avatar">ख</div>

              <div ref={messagesEndRef} />

            <div className="chatbot-chips">
              {chips.map((chip, idx) => (
                <button
                  key={idx}
                  type="button"
                  className="chat-chip"
                  onClick={() => handleSend(chip)}
                >
                  {chip}
                </button>
              ))}
            </div>

            <div className="chatbot-input-bar">
              <input
                type="text"
                value={inputVal}
                onChange={(e) => setInputVal(e.target.value)}
                onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                placeholder={lang === 'hi' ? 'यहाँ सवाल लिखें या बोलें...' : 'Ask a question or speak...'}
              />
              <VoiceInput lang={lang} onTranscript={(text) => handleSend(text)} />
              <button
                type="button"
                className="btn sm primary-dark"
                onClick={() => handleSend()}
                style={{ padding: '8px 14px' }}
              >
                {lang === 'hi' ? 'भेजें' : 'Send'}
              </button>
            </div>
          </div>
        </div>
      );

                        </span>
                      </li>
                      <li>
                        <span className="dot" style={{ background: 'var(--marigold-deep)' }}></span>
                        <span>
                          {lang === 'hi'
                            ? 'कार्यशील पूंजी भंडार अनुशंसित 3 महीने के बफ़र से थोड़ा कम है'
                            : 'Working-capital buffer is under the recommended three-month cushion'}
                        </span>
                      </li>
                    </ul>

                    <div style={{ marginTop: '24px', display: 'flex', gap: '12px' }}>
                      <button type="button" className="btn sm" onClick={() => setActiveTab('schemes')}>
                        {lang === 'hi' ? 'योग्य योजनाएं देखें →' : 'View Eligible Schemes →'}
                      </button>
                      <button type="button" className="btn sm secondary" onClick={() => setActiveTab('repayment')}>
                        {lang === 'hi' ? 'चुकौती योजना देखें' : 'Review Repayment Plan'}
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'feasibility' && (
              <div className="tab-panel active" id="panel-feasibility">
                <div className="swot-grid">
                  <div className="swot-card strength">
                    <h4>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                        <path d="M12 20V10M12 10C12 6 15 4 19 4C19 8 17 10 12 10Z" />
                        <path d="M12 14C12 11 9 9 5 9C5 12 7 14 12 14Z" />
                      </svg>
                      <span>{lang === 'hi' ? 'मजबूती (Strengths)' : 'Strengths'}</span>
                    </h4>
                    <ul>
                      <li>{lang === 'hi' ? 'निकटवर्ती व्यापारिक क्षेत्र में कम प्रतिस्पर्धा' : 'Low existing competition in the catchment area'}</li>
                      <li>{lang === 'hi' ? 'स्थिर दैनिक ज़रूरत की मांग, मौसमी मंदी नहीं' : 'Steady daily-needs demand, not seasonal'}</li>
                      <li>{lang === 'hi' ? 'दुकान स्थल के पास नियमित पैदल आवाजाही' : 'Consistent pedestrian footfall along the chosen strip'}</li>
                    </ul>
                  </div>

                  <div className="swot-card weakness">
                    <h4>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                        <path d="M4 3H20L18 13H6L4 3Z" />
                        <path d="M6 13L4 21" />
                        <path d="M18 13L20 21" />
                      </svg>
                      <span>{lang === 'hi' ? 'कमजोरी (Weaknesses)' : 'Weaknesses'}</span>
                    </h4>
                    <ul>
                      <li>{lang === 'hi' ? 'पहली दो तिमाहियों के लिए पतला नकद भंडार' : 'Thin working-capital buffer for the first two quarters'}</li>
                      <li>{lang === 'hi' ? 'डिजिटल बहीखाता व जीएसटी का पूर्व अनुभव नहीं' : 'No prior digital bookkeeping track record recorded'}</li>
                    </ul>
                  </div>

                  <div className="swot-card opportunity">
                    <h4>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                        <rect x="4" y="10" width="16" height="10" rx="1" />
                        <path d="M4 10L12 4L20 10" />
                      </svg>
                      <span>{lang === 'hi' ? 'अवसर (Opportunities)' : 'Opportunities'}</span>
                    </h4>
                    <ul>
                      <li>{lang === 'hi' ? 'प्रस्तावित स्थान से 400 मीटर दूर नई आवासीय कॉलोनी बन रही है' : 'New residential housing coming up 400m from the proposed site'}</li>
                      <li>{lang === 'hi' ? 'बाद में बिल-भुगतान और पार्सल पिकअप काउंटर जोड़कर अतिरिक्त कमाई' : 'Room to add a bill-payment / micro-ATM counter later for extra footfall'}</li>
                    </ul>
                  </div>

                  <div className="swot-card threat">
                    <h4>
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                        <path d="M7 18C4 18 2 16 2 13C2 10.5 4 9 6 9C6.5 6 9 4 12 4C15 4 17 6.5 17.5 9.5C19.5 9.8 21 11.5 21 13.5C21 16 19 18 16 18H7Z" />
                      </svg>
                      <span>{lang === 'hi' ? 'खतरे (Threats)' : 'Threats'}</span>
                    </h4>
                    <ul>
                      <li>{lang === 'hi' ? '1.2 किमी दूर एक बड़ा मार्ट / थोक स्टोर खुलने की संभावना' : 'A larger regional general store is rumoured to be opening 1.2km away'}</li>
                      <li>{lang === 'hi' ? 'थोक जिंस दरों में हालिया मूल्य वृद्धि' : 'Wholesale rates for daily staples have risen 6% this quarter'}</li>
                    </ul>
                  </div>
                </div>

                <div className="market-strip">
                  <div className="market-item">
                    <div className="val">{metrics.competition || 2}</div>
                    <div className="lbl">{lang === 'hi' ? 'आसपास समान दुकानें' : 'similar stores nearby'}</div>
                  </div>
                  <div className="market-item">
                    <div className="val">{metrics.households || '~1,400'}</div>
                    <div className="lbl">{lang === 'hi' ? 'प्रभाव क्षेत्र में घर' : 'households in catchment'}</div>
                  </div>
                  <div className="market-item">
                    <div className="val">{metrics.distance || '600m'}</div>
                    <div className="lbl">{lang === 'hi' ? 'निकटतम प्रतिस्पर्धी तक दूरी' : 'to nearest competitor'}</div>
                  </div>
                  <div className="market-item">
                    <div className="val" style={{ color: 'var(--paddy-deep)' }}>{metrics.tier || 'Semi-Urban'}</div>
                    <div className="lbl">{lang === 'hi' ? 'बाज़ार का स्तर' : 'market tier'}</div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'schemes' && (
              <div className="tab-panel active" id="panel-schemes">
                <SchemeSelector
                  selectedSchemeId={selectedScheme.id}
                  onSelectScheme={(scheme) => onSelectScheme(scheme)}
                  lang={lang}
                />
              </div>
            )}

            {activeTab === 'calculator' && (
              <div className="tab-panel active" id="panel-calculator">
                <LoanCalculator
                  capital={capital}
                  scheme={selectedScheme}
                  cibilScore={cibilScore}
                  lang={lang}
                />
              </div>
            )}

            {activeTab === 'repayment' && (
              <div className="tab-panel active" id="panel-repayment">
                <RepaymentPlanner
                  loanAmount={totalLoan}
                  annualInterestRate={parseFloat(selectedScheme.interestRate) || 6.0}
                  initialMoratoriumQuarters={selectedScheme.id === 'nsfdc' ? 2 : 1}
                  lang={lang}
                />
              </div>
            )}

            {activeTab === 'cibil' && (
              <div className="tab-panel active" id="panel-cibil">
                <CibilScore
                  score={cibilScore}
                  onScoreChange={onCibilChange}
                  lang={lang}
                />
              </div>
            )}
          </div>
        </section>
      );
    }

    // ==========================================
    // 13. ROOT APP COMPONENT
    // ==========================================
    function App() {
      const [lang, setLang] = useState('en');
      const [activeScreen, setActiveScreen] = useState('landing');
      const [isChatOpen, setIsChatOpen] = useState(false);

      const [entrepreneurName, setEntrepreneurName] = useState('Ramesh Sharma');
      const [businessType, setBusinessType] = useState('Grocery & provisions store');
      const [location, setLocation] = useState('Sojat City, Rajasthan');
      const [capital, setCapital] = useState(180000);
      const [cibilScore, setCibilScore] = useState(720);
      const [selectedScheme, setSelectedScheme] = useState(SCHEMES_DATA[0]);

      const [metrics, setMetrics] = useState({
        households: '~1,400',
        distance: '600m',
        competition: 2,
        tier: 'Semi-Urban'
      });

      useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.classList.toggle('lang-hi', lang === 'hi');
      }, [lang]);

      const handleNavigate = (screen) => {
        setActiveScreen(screen);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      return (
        <div className={`khata-app ${lang === 'hi' ? 'lang-hi' : ''}`}>
          <Header
            lang={lang}
            onLangChange={setLang}
            entrepreneurName={entrepreneurName}
            onOpenChat={() => setIsChatOpen(true)}
            onNavigate={handleNavigate}
            activeScreen={activeScreen}
          />

          <main className="wrap">
            {activeScreen === 'landing' && (
              <HeroLanding
                onStartAssessment={() => handleNavigate('input')}
                onViewSample={() => handleNavigate('results')}
                onOpenChat={() => setIsChatOpen(true)}
                lang={lang}
              />
            )}

            {activeScreen === 'input' && (
              <InputScreen
                entrepreneurName={entrepreneurName}
                onNameChange={setEntrepreneurName}
                businessType={businessType}
                onBusinessChange={setBusinessType}
                location={location}
                onLocationChange={setLocation}
                capital={capital}
                onCapitalChange={setCapital}
                onMetricsChange={setMetrics}
                onSubmit={() => handleNavigate('results')}
                lang={lang}
              />
            )}

            {activeScreen === 'results' && (
              <ResultsDashboard
                entrepreneurName={entrepreneurName}
                businessType={businessType}
                location={location}
                capital={capital}
                selectedScheme={selectedScheme}
                onSelectScheme={setSelectedScheme}
                cibilScore={cibilScore}
                onCibilChange={setCibilScore}
                metrics={metrics}
                onEditAnswers={() => handleNavigate('input')}
                onOpenChat={() => setIsChatOpen(true)}
                lang={lang}
              />
            )}
          </main>

          <button
            type="button"
            className="chatbot-floating-trigger"
            onClick={() => setIsChatOpen(true)}
            aria-label="Open Khata Saathi Chatbot"
          >
            <span style={{ fontSize: '1.2rem' }}>💬</span>
            <span>{lang === 'hi' ? 'खाता साथी (AI)' : 'Khata Saathi (AI)'}</span>
          </button>

          <Chatbot
            isOpen={isChatOpen}
            onClose={() => setIsChatOpen(false)}
            lang={lang}
            entrepreneurName={entrepreneurName}
          />

          <footer>
            <div className="footer-inner">
              <div>
                <strong>Khata React Edition</strong> · {lang === 'hi' ? 'सूक्ष्म उद्यमियों के लिए व्यावसायिक और वित्तीय सलाहकार' : 'Business and Financial Advisory for Hyperlocal Entrepreneurs'}
              </div>
              <div style={{ fontSize: '0.8rem', color: 'var(--ink-soft)' }}>
                {lang === 'hi'
                  ? 'NSFDC, PMEGP, मुद्रा व सरकारी योजनाओं के मार्गदर्शन हेतु प्रोटोटाइप'
                  : 'Prototype for SIH26091 — Built with React, Web Speech API & Government Micro-credit Schemes'}
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
